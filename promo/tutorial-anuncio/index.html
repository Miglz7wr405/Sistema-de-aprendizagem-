<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<title>Insight Academia — Anúncio tutorial</title>
<style>
@font-face { font-family: "Inter"; font-weight: 400 700; src: url("inter-latin.woff2") format("woff2"); }
@font-face { font-family: "SG"; font-weight: 500 700; src: url("space-grotesk-latin.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #03060f; }
body { font-family: "Inter", sans-serif; color: #fff; }
#palco { position: absolute; inset: 0; overflow: hidden; perspective: 2000px;
  background: radial-gradient(ellipse at 50% 35%, #1a3cff 0%, #0a1a7a 45%, #03060f 100%); }
.abs { position: absolute; }
.txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "SG"; font-weight: 700;
  letter-spacing: -.03em; line-height: .95; text-transform: uppercase; will-change: transform, opacity; }
.az { color: #8fb0ff; }
.chip { position: absolute; padding: 18px 30px; border-radius: 999px; background: #fff; color: #0033ff;
  font-family: "SG"; font-weight: 700; font-size: 44px; box-shadow: 0 20px 50px rgba(0,0,0,.4); white-space: nowrap; }
#telemovel { position: absolute; left: 50%; top: 50%; width: 600px; height: 1300px; margin: -650px 0 0 -300px;
  border-radius: 64px; background: #0f1e37; padding: 17px; box-shadow: 0 60px 140px rgba(0,0,0,.6);
  transform-style: preserve-3d; }
#ecra { width: 566px; height: 1266px; border-radius: 48px; display: block; background: #f4f7fc; }
.capa { position: absolute; inset: 0; overflow: hidden; }
.capa img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.capa .sombra { position: absolute; inset: 0; background: linear-gradient(to top, rgba(3,6,15,.95) 0%, rgba(3,6,15,.2) 55%, rgba(3,6,15,.35) 100%); }
.capa .nome { position: absolute; left: 70px; right: 70px; bottom: 300px; font-family: "SG"; font-weight: 700; font-size: 120px; line-height: .92; letter-spacing: -.03em; text-transform: uppercase; }
.capa .sub { position: absolute; left: 74px; bottom: 230px; font-size: 40px; font-weight: 600; color: #8fb0ff; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#linhas { position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px); }
.botao { display: inline-block; padding: 34px 70px; border-radius: 999px; background: #fff; color: #0033ff; font-family: "SG"; font-weight: 700; font-size: 64px; }
</style>
</head>
<body>
<div id="palco">
  <div id="capas"></div>
  <div id="telemovel"><canvas id="ecra" width="444" height="974"></canvas></div>
  <div id="textos"></div>
  <div id="linhas"></div>
  <div id="flash"></div>
</div>
<script>
const FPS = 30, DURACAO = 34.5;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const E = { out: t => 1 - Math.pow(1 - t, 3), io: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2, back: t => 1 + 2.4 * Math.pow(t - 1, 3) + 1.4 * Math.pow(t - 1, 2) };
const P = (t, a, b, e = "out") => E[e](clamp((t - a) / (b - a)));
const $ = (h, pai = document.getElementById("textos")) => { const d = document.createElement("div"); d.innerHTML = h; const el = d.firstElementChild; pai.appendChild(el); return el; };

/* ── excertos da plataforma (fotogramas a 30 fps, já acelerados) ── */
const CLIPS = { login: 92, areas: 143, aula: 103, perg: 42, comu: 40, rank: 103, casa: 71 };
const IMG = {};
for (const [n, q] of Object.entries(CLIPS)) IMG[n] = Array.from({ length: q }, (_, i) => { const im = new Image(); im.src = `out/clips/${n}/f${String(i + 1).padStart(3, "0")}.jpg`; return im; });
const ecra = document.getElementById("ecra").getContext("2d");
// [início, fim, clip] — o clip começa no início do plano
const PLANOS = [[2.85, 6.6, "login"], [6.6, 11.9, "areas"], [16.9, 20.7, "aula"], [20.7, 22.2, "perg"], [22.2, 23.6, "comu"], [23.6, 27.45, "rank"], [27.45, 30.2, "casa"]];

/* ── textos (frases ao ritmo da voz) ── */
const T = (html, top, size) => $(`<div class="txt" style="top:${top}px;font-size:${size}px">${html}</div>`);
const gancho = ["Queres", "aprender", "a faturar", "<span class=az>online?</span>"].map((w, i) => T(w, 560 + i * 190, 180));
const tEntras = T("Entras…", 150, 130), tTudo = T("e está <span class=az>tudo aqui</span>", 150, 110);
const chips = ["Marketing digital", "TikTok Shop", "Tráfego pago", "Design"].map((c) => $(`<div class="chip">${c}</div>`));
const tNomes = T("Os <span class=az>maiores nomes</span>", 160, 90);
const tPlay = T("▶ Play", 140, 130), tFeita = T("✓ <span class=az>Concluída</span>", 140, 120);
const tDuvida = T("Tira <span class=az>dúvidas</span>", 140, 120), tComu = T("<span class=az>Comunidade</span>", 140, 120);
const tRank = T("Sobe no <span class=az>ranking</span>", 140, 110), tPremio = T("🏆 Top 3 do mês <span class=az>ganha prémio</span>", 1770, 60);
const tTelemovel = T("No teu <span class=az>telemóvel</span>", 140, 110), tRitmo = T("ao teu ritmo", 1770, 70);
const cta = $(`<div class="abs" style="left:0;right:0;top:520px;text-align:center">
  <svg viewBox="0 0 64 64" width="190" height="190" fill="none"><g stroke="#fff" stroke-width="8.5" stroke-linecap="round"><line x1="32" y1="7" x2="32" y2="57"/><line x1="7" y1="32" x2="57" y2="32"/><line x1="14.3" y1="14.3" x2="49.7" y2="49.7"/><line x1="49.7" y1="14.3" x2="14.3" y2="49.7"/></g></svg>
  <div style="font-family:SG;font-weight:700;font-size:150px;letter-spacing:-.04em;line-height:1;margin-top:30px">insight</div>
  <div style="font-size:40px;letter-spacing:.5em;color:#8fb0ff;font-weight:600;margin-top:10px">ACADEMIA</div>
  <div style="margin-top:110px"><span class="botao" id="botao">Entra hoje</span></div>
  <div style="margin-top:80px;font-size:38px;font-weight:600;line-height:1.6;color:#cfdcff">WhatsApp<br>+351 933 652 888 · +258 86 727 2348</div></div>`);

/* ── capas dos cursos (cortes rápidos) ── */
const CAPAS = [["bessan.jpg", "Matheus<br>Bessan", "Do zero aos 1000 USD"], ["finch.jpg", "Thiago<br>Finch", "Funnel Bureau"],
  ["caio.jpg", "Caio<br>Martins", "Vende em 24 horas"], ["enrico.png", "Enrico", "Marketing & Copywriting"]];
const capas = CAPAS.map(([f, n, s]) => $(`<div class="capa"><img src="out/covers/${f}"><div class="sombra"></div><div class="nome">${n}</div><div class="sub">${s}</div></div>`, document.getElementById("capas")));
const T_CAPA = [12.1, 13.25, 14.4, 15.55, 16.9];

const st = (el, op, tf = "none") => { el.style.opacity = op; el.style.transform = tf; };
/** entrada "slam" com separação de cor nos primeiros 0,15 s */
function slam(el, t, a, b = 99) {
  const p = P(t, a, a + .28, "back"), sai = P(t, b - .15, b);
  const vis = t >= a && t < b;
  el.style.opacity = vis ? Math.min(1, p * 3) * (1 - sai) : 0;
  el.style.transform = `scale(${1.5 - .5 * p}) translateY(${(1 - p) * -30}px)`;
  const g = t - a < .16 && vis ? 12 : 0;
  el.style.textShadow = g ? `${g}px 0 #ff2d55, ${-g}px 0 #00d0ff` : "0 8px 40px rgba(0,0,0,.45)";
}

function seek(t) {
  // gancho
  gancho.forEach((el, i) => slam(el, t, .05 + i * .38, 2.75));
  // flash nos cortes principais
  const cortes = [2.8, 6.6, 11.9, 16.9, 20.7, 23.6, 27.45, 30.2];
  const f = Math.max(0, ...cortes.map((c) => 1 - Math.abs(t - c) / .12));
  document.getElementById("flash").style.opacity = (f * .55).toFixed(3);

  // telemóvel com o excerto do plano atual
  const pl = PLANOS.find(([a, b]) => t >= a && t < b);
  const tel = document.getElementById("telemovel");
  if (pl) {
    const [a, b, n] = pl, lt = t - a, imgs = IMG[n];
    const im = imgs[clamp(Math.floor(lt * FPS), 0, imgs.length - 1)];
    if (im.complete && im.naturalWidth) ecra.drawImage(im, 0, 0, 444, 974);
    const ent = P(t, a, a + .3, "back");
    let rot = "", esc = 1, y = 90;
    if (n === "casa") { rot = `rotateY(${Math.sin(lt * 2.2) * 18}deg) rotateX(6deg)`; esc = 1.02; }
    if (n === "areas") { esc = .92; y = 150; }
    if (n === "rank") { esc = .9; y = 40; }
    if (n === "casa") { y = 40; esc = .94; }
    tel.style.opacity = 1;
    tel.style.transform = `translateY(${y + (1 - ent) * 260}px) scale(${esc * (.9 + .1 * ent)}) ${rot}`;
  } else tel.style.opacity = 0;

  slam(tEntras, t, 2.9, 4.35); slam(tTudo, t, 4.35, 6.6);
  chips.forEach((c, i) => {
    const a = 7.2 + i * .95, p = P(t, a, a + .3, "back"), vis = t >= a && t < 11.9;
    c.style.opacity = vis ? Math.min(1, p * 2) : 0;
    const lado = i % 2 ? 1 : -1;
    c.style.left = (i % 2 ? 560 : 70) + "px"; c.style.top = (260 + i * 85) + "px";
    c.style.transform = `translateX(${(1 - p) * lado * 500}px) rotate(${lado * -3}deg)`;
  });

  // capas
  capas.forEach((c, i) => {
    const a = T_CAPA[i], b = T_CAPA[i + 1], vis = t >= a && t < b, lt = t - a;
    c.style.opacity = vis ? 1 : 0;
    c.querySelector("img").style.transform = `scale(${1.18 - lt * .06}) translateX(${(i % 2 ? -1 : 1) * lt * 12}px)`;
    const nm = c.querySelector(".nome"), p = P(t, a, a + .3, "back");
    nm.style.transform = `translateY(${(1 - p) * 80}px)`; nm.style.opacity = p;
  });
  slam(tNomes, t, 12.1, 16.9);

  slam(tPlay, t, 17.15, 18.9); slam(tFeita, t, 18.9, 20.7);
  slam(tDuvida, t, 20.8, 22.2); slam(tComu, t, 22.2, 23.6);
  slam(tRank, t, 23.7, 27.45); slam(tPremio, t, 25.5, 27.45);
  slam(tTelemovel, t, 27.55, 30.2); slam(tRitmo, t, 28.7, 30.2);

  // CTA
  const pc = P(t, 30.3, 30.75, "back");
  cta.style.opacity = t >= 30.3 ? Math.min(1, pc * 2) : 0;
  cta.style.transform = `scale(${1.25 - .25 * pc})`;
  const bt = document.getElementById("botao");
  bt.style.transform = `scale(${t > 31.2 ? 1 + .05 * Math.sin((t - 31.2) * 7) : 1})`;
}
window.seek = seek; window.DURACAO = DURACAO; window.FPS = FPS;
window.ready = document.fonts.ready.then(() => Promise.all([...document.images, ...Object.values(IMG).flat()].map((i) => i.decode().catch(() => {})))).then(() => { seek(0); return true; });
</script>
</body>
</html>
