const E = {

};
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

/** Keyframes: [[t, v], [t, v, "ease"]...] — a ease aplica-se ao segmento que acaba nesse ponto. */

  if (t <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {

/* ═══════════════════ FUNDO + PARTÍCULAS + GRÃO ═══════════════════ */
const bg = document.getElementById("bg").getContext("2d");

const grain = document.createElement("canvas"); grain.width = grain.height = 256;
{ const g = grain.getContext("2d"); const id = g.createImageData(256, 256); const r2 = rng(3);
  for (let i = 0; i < id.data.length; i += 4) { const v = r2() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 22; }

function drawBg(t, hue) {
  // hue: {a: cor principal, b: secundária, k: intensidade}
  bg.fillStyle = "#03060f"; bg.fillRect(0, 0, 1080, 1920);

    [540 + Math.sin(t * .23) * 260, 520 + Math.cos(t * .17) * 160, 900, hue.a, hue.k],
    [300 + Math.cos(t * .19) * 200, 1500 + Math.sin(t * .21) * 180, 820, hue.b, hue.k * .8],
    [880, 1100 + Math.sin(t * .3) * 200, 600, hue.a, hue.k * .5],

  for (const [x, y, r, c, a] of blobs) {
    const g = bg.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c.replace("A", (.55 * a).toFixed(3))); g.addColorStop(1, c.replace("A", "0"));

  bg.restore();
}
function drawFx(t, frame, dustA) {
  fx.clearRect(0, 0, 1080, 1920);
  // poeira em câmara lenta (bokeh)

    const y = ((d.y - t * d.sp * (0.4 + d.z)) % 1920 + 1920) % 1920;
    const x = d.x + Math.sin(t * .3 + d.ph) * 30;
    const a = (0.08 + d.z * .25) * dustA * (0.6 + .4 * Math.sin(t * .8 + d.ph));
    const g = fx.createRadialGradient(x, y, 0, x, y, d.r * (1 + d.z * 2));
    g.addColorStop(0, `rgba(170,195,255,${a})`); g.addColorStop(1, "rgba(170,195,255,0)");

/* ═══════════════════ HELPERS DE ESTILO ═══════════════════ */

  if ("l" in o) s.left = o.l + "px"; if ("t" in o) s.top = o.t + "px";
  if ("w" in o) s.width = o.w + "px"; if ("h" in o) s.height = o.h + "px";
}
const hide = el => st(el, { op: 0 });
function showScreen(name, x = 0) {

function placePhone(cx, cy, s, rx = 0, ry = 0, rz = 0, z = 0, op = 1, blur = 0) {

  if (t >= T.cta - .1) {
    const lt = t - T.cta;
    const ph = P(lt, .1, 1.6, "slow");
    const phOut = P(lt, 6.0, 6.8, "io");
    placePhone(540, mix(1900, 1080, ph) - phOut * 80, mix(1.05, 1.0, ph) * (1 - phOut * .2), mix(30, 4, ph), mix(-20, 0, ph) + Math.sin(t * .6) * 3, 0, 0, 1 - phOut, phOut * 10);
    showScreen("wa");
    const msg = "QUERO ACESSO";
    const typed = Math.floor(clamp((lt - 1.6) / 1.1) * msg.length);
    const sent = lt > 3.0;
    document.getElementById("waTyping").textContent = sent ? "" : msg.slice(0, typed);
    document.getElementById("waCaret").style.opacity = (sent || Math.floor(t * 2) % 2) ? 0 : 1;
    document.getElementById("waTxt").textContent = msg;
    st(document.getElementById("waOut"), { op: P(lt, 3.0, 3.25), tf: `translateY(${(1 - P(lt, 3.0, 3.4, "back")) * 30}px)` });
    document.getElementById("waTick").style.color = lt > 3.7 ? "#53bdeb" : "#8a9";
    document.getElementById("waSend").style.transform = `scale(${lt > 2.85 && lt < 3.0 ? .85 : 1})`;
    st(document.getElementById("waIn"), { op: P(lt, .8, 1.1) });
    const fin = P(lt, 6.2, 7.2, "slow");
    st(ctaLogo, { op: P(lt, .3, 1.0), tf: `translateY(${(1 - P(lt, .3, 1.4, "slow")) * -40}px)` });
    st(ctaTag, { op: fin, tf: `translateY(${(1 - fin) * 50}px)`, blur: (1 - fin) * 12 });
    st(ctaPill, { op: fin, tf: `scale(${.8 + .2 * fin + Math.sin(t * 3) * .012 * fin})` });
    const n1 = P(lt, 3.6, 4.4, "slow"), n2 = P(lt, 3.9, 4.7, "slow");
    st(nPT, { op: n1, tf: `translateX(${(1 - n1) * -300}px)`, blur: (1 - n1) * 10 });
    st(nMZ, { op: n2, tf: `translateX(${(1 - n2) * 300}px)`, blur: (1 - n2) * 10 });
    const pulse = .5 + .5 * Math.sin(t * 4);
    nPT.querySelector(".wa").style.boxShadow = nMZ.querySelector(".wa").style.boxShadow = `0 0 ${20 + pulse * 30}px rgba(37,211,102,${.5 + pulse * .4})`;
  }
  caption(12, t);

  /* ── flashes nas viragens (speed ramp) ── */
  const fl = Math.max(...[T.logo, T.home, T.car, T.cta].map(c => Math.exp(-Math.pow((t - c) / .07, 2)) * (t < c ? .35 : 1) * .85));
  document.getElementById("flash").style.opacity = fl * .55;
  const fb = Math.max(...[T.sec, T.num, T.vs].map(c => Math.exp(-Math.pow((t - c) / .12, 2))));
  document.getElementById("flashBlue").style.opacity = fb * .35;

  drawFx(t, curFrame, t < T.logo ? .4 : 1);
}

window.seek = seek;
window.DURACAO = DURACAO; window.FPS = FPS;
window.ready = document.fonts.ready.then(() => { seek(0); return true; });
</script>
